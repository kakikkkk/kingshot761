 for(const fs of [.45,.42,.39,.36,.33,.30,.27,.24,.22,.20,.18]){
   ctx.font=`750 ${fs*100}px system-ui,sans-serif`;
   const lines=[];let line='';
   for(const p of parts){
     if(line && ctx.measureText(line+p).width>maxW){lines.push(line);line=p}
     else line+=p;
   }
   if(line)lines.push(line);
   if(lines.length*fs*1.22<=maxH && lines.every(s=>ctx.measureText(s).width<=maxW*1.02))return {fs,lines};
 }
 return {fs:.18,lines:[name]};
}
function show(o,g){
  if(selected?.g)selected.g.classList.remove('active');
  selected={o,g};if(g&&g.classList.contains('city'))g.classList.add('active');
  infoName.textContent=o.name;infoCoord.textContent=`X: ${o.x}　Y: ${o.y}`;
  info.classList.add('visible');help.style.display='none';
}
function clearSelection(){if(selected?.g)selected.g.classList.remove('active');selected=null;info.classList.remove('visible');help.style.display='';}
function register(g,o){g.__entry=o;g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',`${o.name}，X ${o.x}，Y ${o.y}`);node('title',{},g).textContent=`${o.name} (${o.x}, ${o.y})`;g.addEventListener('click',e=>{e.stopPropagation();show(o,g)});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(o,g)}})}
function drawMember(o){
  const g=node('g',{class:'city',transform:`translate(${o.x} ${o.y})`},layer);
  node('rect',{class:'citybox',x:0,y:0,width:1.84,height:1.84,rx:.18,fill:o.color},g);
  const txt=textLines(o.name),lineH=txt.fs*1.16,total=(txt.lines.length-1)*lineH;
  const t=node('text',{'text-anchor':'middle','font-size':txt.fs,'dominant-baseline':'middle'},g);
  txt.lines.forEach((s,i)=>{const tp=node('tspan',{x:.92,y:.92-total/2+i*lineH},t);tp.textContent=s});
  register(g,o);
}
function drawReserved(o){const g=node('g',{class:'reserved'},layer);node('rect',{x:o.x,y:o.y,width:1.82,height:1.82,rx:.12,fill:'#304052','fill-opacity':'.47',stroke:'#b5c3d2','stroke-width':'.055','stroke-dasharray':'.16 .12'},g);const t=node('text',{x:o.x+.91,y:o.y+.96,'font-size':'.31','text-anchor':'middle',fill:'#d7e0eb'},g);t.textContent='預留空位';register(g,o)}
function drawTrap(o){const g=node('g',{class:'trap'},layer);node('rect',{x:o.x,y:o.y,width:2.18,height:2.18,rx:.26,fill:'#b84f58',stroke:'#f4b5a6','stroke-width':'.075'},g);const t=node('text',{x:o.x+1.09,y:o.y+1.15,'text-anchor':'middle','font-size':'.42','font-weight':'800',fill:'#fff'},g);t.textContent=o.name.replace('熊陷阱 ','熊');register(g,o)}
function drawFlag(o){const g=node('g',{class:'flag'},layer);node('circle',{cx:o.x+.32,cy:o.y+.32,r:.29,fill:'#f2c34d',stroke:'#594319','stroke-width':'.06'},g);const t=node('text',{x:o.x+.32,y:o.y+.325,'font-size':'.25','font-weight':'800',fill:'#342608','text-anchor':'middle','dominant-baseline':'middle'},g);t.textContent=o.id;register(g,o)}
function drawResource(o){const g=node('g',{class:'resource'},layer);node('rect',{x:o.x,y:o.y,width:2.1,height:1.8,rx:.18,fill:'#264b65',stroke:'#8ec8f3','stroke-width':'.09','stroke-dasharray':'.12 .12'},g);const t=node('text',{x:o.x+1.05,y:o.y+.96,'text-anchor':'middle','dominant-baseline':'middle','font-size':'.33','font-weight':'750',fill:'white'},g);t.textContent='資源參考';register(g,o)}
// Layer order keeps member names readable, and makes flag markers easy to locate.
entries.filter(o=>o.t==='reserved').forEach(drawReserved);
entries.filter(o=>o.t==='resource').forEach(drawResource);
entries.filter(o=>o.t==='beartrap').forEach(drawTrap);
members.forEach(drawMember);
entries.filter(o=>o.t==='banner').forEach(drawFlag);
function renderCamera(){const r=svg.getBoundingClientRect();if(!r.width||!r.height)return;const w=r.width/camera.scale,h=r.height/camera.scale;svg.setAttribute('viewBox',`${camera.cx-w/2} ${camera.cy-h/2} ${w} ${h}`);const over=camera.scale<2;layer.style.display=over?'none':'';overview.style.display=over?'':'none';if(over)drawOverview()}
const nearBounds={left:719,right:743,top:606,bottom:640};
function fitBounds(b){const r=svg.getBoundingClientRect();const w=b.right-b.left,h=b.bottom-b.top;camera.cx=(b.left+b.right)/2;camera.cy=(b.top+b.bottom)/2;camera.scale=Math.max(.5,Math.min(100,r.width/w,r.height/h));renderCamera()}
function goNear(){mode='near';document.getElementById('nearBtn').classList.add('active');document.getElementById('allBtn').classList.remove('active');const r=svg.getBoundingClientRect();camera.scale=Math.min(32,Math.max(19,r.width/15));camera.cx=731;camera.cy=622;renderCamera()}
function goAll(){mode='all';document.getElementById('allBtn').classList.add('active');document.getElementById('nearBtn').classList.remove('active');fitBounds({left:718,right:744,top:605,bottom:640})}
function moveTo(o){mode='custom';document.getElementById('nearBtn').classList.remove('active');document.getElementById('allBtn').classList.remove('active');camera.cx=o.x+1;camera.cy=o.y+1;camera.scale=Math.max(camera.scale,25);camera.scale=Math.min(camera.scale,55);renderCamera();let g=[...layer.children].find(n=>n.getAttribute('aria-label')?.startsWith(o.name+'，X '+o.x+'，Y '+o.y));show(o,g||null)}
function drawOverview(){
  overview.replaceChildren();
  const px=16/camera.scale;
  const main=node('g',{},overview);
  node('circle',{cx:731,cy:622,r:px*1.25,fill:'#b84f58',stroke:'#fff0cc','stroke-width':px*.08},main);
  let t=node('text',{x:731,y:622.1,'text-anchor':'middle','dominant-baseline':'middle','font-size':px*.56,'font-weight':'800',fill:'white'},main);t.textContent='熊區';
  main.style.cursor='pointer';main.addEventListener('click',goNear);
  resources.forEach(o=>{
    const g=node('g',{},overview);node('circle',{cx:o.x+.8,cy:o.y+.8,r:px*.75,fill:'#4a9edd',stroke:'#c6e6ff','stroke-width':px*.07},g);
    const t=node('text',{x:o.x+.8,y:o.y+.9,'text-anchor':'middle','dominant-baseline':'middle','font-size':px*.38,'font-weight':'800',fill:'white'},g);t.textContent='參考';
    g.style.cursor='pointer';g.addEventListener('click',()=>moveTo(o));
  });
}
function zoom(factor,originX,originY){
 const r=svg.getBoundingClientRect(),old=camera.scale;
 const newS=Math.max(.7,Math.min(95,old*factor));
 const ax=(originX??r.width/2)-r.width/2,ay=(originY??r.height/2)-r.height/2;
 camera.cx+=ax/old-ax/newS;camera.cy+=ay/old-ay/newS;camera.scale=newS;
 renderCamera();
}
let pointers=new Map(),startPoints=new Map(),downTargets=new Map(),dragging=false,moved=false,lastMid=null,lastDist=null;
const point=e=>{const r=svg.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
svg.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 svg.setPointerCapture(e.pointerId);pointers.set(e.pointerId,point(e));startPoints.set(e.pointerId,point(e));downTargets.set(e.pointerId,e.target.closest?.('g[role=button]')||null);dragging=true;moved=false;
});
svg.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 const old=pointers.get(e.pointerId),p=point(e);pointers.set(e.pointerId,p);
 const list=[...pointers.values()];
 if(list.length===1){const start=startPoints.get(e.pointerId);if(Math.hypot(p.x-start.x,p.y-start.y)>8)moved=true;if(moved){camera.cx-=(p.x-old.x)/camera.scale;camera.cy-=(p.y-old.y)/camera.scale;renderCamera()}}
 else if(list.length>=2){moved=true;const a=list[0],b=list[1],d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};if(lastDist){zoom(d/lastDist,mid.x,mid.y);camera.cx-=(mid.x-lastMid.x)/camera.scale;camera.cy-=(mid.y-lastMid.y)/camera.scale;renderCamera()}lastDist=d;lastMid=mid}
});
function release(e){const hit=downTargets.get(e.pointerId);const isTap=e.type==='pointerup'&&!moved&&pointers.size===1; if(isTap&&hit?.__entry)show(hit.__entry,hit);downTargets.delete(e.pointerId);startPoints.delete(e.pointerId);pointers.delete(e.pointerId);if(pointers.size<2){lastDist=null;lastMid=null}if(!pointers.size){dragging=false;setTimeout(()=>{moved=false},0)}}
svg.addEventListener('pointerup',release);svg.addEventListener('pointercancel',release);
svg.addEventListener('wheel',e=>{e.preventDefault();const p=point(e);zoom(e.deltaY<0?1.17:1/1.17,p.x,p.y)},{passive:false});
svg.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault()}},{capture:true});
document.getElementById('zoomIn').onclick=()=>zoom(1.35);
document.getElementById('zoomOut').onclick=()=>zoom(1/1.35);
document.getElementById('recenter').onclick=goNear;
document.getElementById('nearBtn').onclick=goNear;
document.getElementById('allBtn').onclick=goAll;
document.getElementById('closeInfo').onclick=clearSelection;
document.getElementById('copyCoord').onclick=async()=>{
 if(!selected)return;const val=`${selected.o.x},${selected.o.y}`;
 try{await navigator.clipboard.writeText(val)}catch(e){const input=document.createElement('textarea');input.value=val;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();document.execCommand('copy');input.remove()}
 const btn=document.getElementById('copyCoord');btn.textContent='已複製 ✓';setTimeout(()=>{btn.textContent='複製座標'},1300);
};
const rc=document.getElementById('resources');resources.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.textContent=`${i+1}. X${o.x} Y${o.y}`;b.addEventListener('click',()=>moveTo(o));rc.appendChild(b)});
const input=document.getElementById('search'),matches=document.getElementById('matches');
input.addEventListener('input',()=>{const s=input.value.trim().toLocaleLowerCase();matches.replaceChildren();if(!s){matches.style.display='none';return}const found=members.filter(o=>o.name.toLocaleLowerCase().includes(s)).slice(0,10);matches.style.display=found.length?'block':'none';for(const o of found){const b=document.createElement('button');b.type='button';b.textContent=o.name;b.onclick=()=>{input.value=o.name;matches.style.display='none';moveTo(o)};matches.appendChild(b)}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){const first=members.find(o=>o.name.toLocaleLowerCase().includes(input.value.trim().toLocaleLowerCase()));if(first){input.blur();matches.style.display='none';moveTo(first)}}});
document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))matches.style.display='none'});
new ResizeObserver(()=>renderCamera()).observe(svg);
requestAnimationFrame(goNear);
</script>

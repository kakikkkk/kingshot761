 g.addEventListener('click',e=>{if(dragSuppressed)return;e.stopPropagation();show(o)});
}
function show(o){
 if(state.selected)elemById.get(state.selected)?.classList.remove('selected');
 state.selected=o;elemById.get(o)?.classList.add('selected');
 $('popName').textContent=o.name;
 $('popCoord').textContent=`X: ${o.x}    Y: ${o.y}`;
 popup.classList.add('visible');tip.style.display='none';
}
function hide(){if(state.selected)elemById.get(state.selected)?.classList.remove('selected');state.selected=null;popup.classList.remove('visible');tip.style.display='';}
function cameraRender(){const r=svg.getBoundingClientRect();if(!r.width||!r.height)return;const w=r.width/state.scale,h=r.height/state.scale;svg.setAttribute('viewBox',`${state.cx-w/2} ${state.cy-h/2} ${w} ${h}`)}
function fit(box,padding=3.5){const r=svg.getBoundingClientRect();if(!r.width||!r.height)return;state.cx=(box.l+box.r)/2;state.cy=(box.t+box.b)/2;state.scale=Math.max(.5,Math.min(r.width/(box.r-box.l+padding*2),r.height/(box.b-box.t+padding*2)));cameraRender()}
function tabs(active){for(const id of ['all','bear1','bear2'])$(id).classList.toggle('active',id===active)}
function goAll(){tabs('all');fit(fullBounds)}
function goBear(i){tabs('bear'+i);const o=traps.find(t=>t.name==='熊'+i),c=center(o),r=svg.getBoundingClientRect();state.cx=c.x;state.cy=c.y;state.scale=Math.min(60,Math.max(17,r.width/15));cameraRender()}
function focus(o){tabs(null);const c=center(o),r=svg.getBoundingClientRect();state.cx=c.x;state.cy=c.y;state.scale=Math.min(65,Math.max(state.scale,r.width/11));cameraRender();show(o)}
function zoom(mult,x,y){const r=svg.getBoundingClientRect(),old=state.scale,next=Math.max(2,Math.min(105,old*mult)),ax=(x??r.width/2)-r.width/2,ay=(y??r.height/2)-r.height/2;state.cx+=ax/old-ax/next;state.cy+=ay/old-ay/next;state.scale=next;cameraRender()}
// Draw mines beneath members and flags to preserve labels on dense maps.
drawGrid();
for(const t of ['resource','obs2','beartrap','city','banner'])data.filter(o=>o.type===t).forEach(draw);
$('all').onclick=goAll;$('bear1').onclick=()=>goBear(1);$('bear2').onclick=()=>goBear(2);
$('zoomIn').onclick=()=>zoom(1.3);$('zoomOut').onclick=()=>zoom(1/1.3);$('reset').onclick=goAll;
$('close').onclick=hide;
$('copy').onclick=async()=>{
 if(!state.selected)return;const s=`${state.selected.x},${state.selected.y}`;
 try{await navigator.clipboard.writeText(s)}catch(e){const a=document.createElement('textarea');a.value=s;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
 const b=$('copy');b.textContent='已複製 ✓';setTimeout(()=>b.textContent='複製座標',1200)
};
for(const o of mines){const b=document.createElement('button');b.type='button';b.textContent=`${o.kind} ${o.x},${o.y}`;b.onclick=()=>focus(o);$('mineList').appendChild(b)}
const search=$('search'),results=$('results');
search.addEventListener('input',()=>{const q=search.value.trim().toLocaleLowerCase();results.replaceChildren();if(!q){results.style.display='none';return}const hits=members.filter(o=>o.name.toLocaleLowerCase().includes(q)).slice(0,12);results.style.display=hits.length?'block':'none';for(const o of hits){const b=document.createElement('button');b.type='button';b.textContent=o.name;b.onclick=()=>{search.value=o.name;results.style.display='none';focus(o)};results.appendChild(b)}});
search.addEventListener('keydown',e=>{if(e.key==='Enter'){const q=search.value.trim().toLocaleLowerCase();const o=members.find(v=>v.name.toLocaleLowerCase().includes(q));if(o){search.blur();results.style.display='none';focus(o)}}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))results.style.display='none'});
const pointers=new Map();let dragSuppressed=false,lastDist=null,lastMid=null;let downTarget=null;let downAt=null;let wasDragged=false;
const point=e=>{const r=svg.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
svg.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;const p=point(e);if(pointers.size===0){downTarget=e.target.closest?.('.map-object')||null;downAt=p;wasDragged=false;dragSuppressed=false}pointers.set(e.pointerId,p);if(pointers.size>1){lastDist=null;lastMid=null;wasDragged=true}svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;const p=point(e),old=pointers.get(e.pointerId);pointers.set(e.pointerId,p);
 if(pointers.size===1){if(downAt&&Math.hypot(p.x-downAt.x,p.y-downAt.y)>6)wasDragged=true;if(wasDragged){state.cx-=(p.x-old.x)/state.scale;state.cy-=(p.y-old.y)/state.scale;cameraRender()}}
 else{wasDragged=true;const [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};if(lastDist&&lastMid){zoom(d/lastDist,mid.x,mid.y);state.cx-=(mid.x-lastMid.x)/state.scale;state.cy-=(mid.y-lastMid.y)/state.scale;cameraRender()}lastDist=d;lastMid=mid}
});
function pointerEnd(e){if(!pointers.has(e.pointerId))return;const canTap=e.type==='pointerup'&&!wasDragged&&pointers.size===1;const target=downTarget;pointers.delete(e.pointerId);if(canTap&&target?.__data)show(target.__data);if(wasDragged){dragSuppressed=true;setTimeout(()=>dragSuppressed=false,90)}if(pointers.size<2){lastDist=null;lastMid=null}if(pointers.size===0){downAt=null;downTarget=null}}
svg.addEventListener('pointerup',pointerEnd);svg.addEventListener('pointercancel',pointerEnd);
svg.addEventListener('wheel',e=>{e.preventDefault();const p=point(e);zoom(e.deltaY<0?1.16:1/1.16,p.x,p.y)},{passive:false});
window.addEventListener('resize',cameraRender);
requestAnimationFrame(goAll);
</script>
